services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fritterflix}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-fritterflix}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      FRITTERFLIX_ADMIN_PASSWORD: ${FRITTERFLIX_ADMIN_PASSWORD:?set FRITTERFLIX_ADMIN_PASSWORD}
      MEDIA_PROXY_BASE_URL: ${MEDIA_PROXY_BASE_URL:-http://media-proxy:8080}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "172.18.0.1:3002:3000"
    networks:
      - fritterflix_internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fritterflix}
      POSTGRES_USER: ${POSTGRES_USER:-fritterflix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fritterflix} -d ${POSTGRES_DB:-fritterflix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fritterflix_internal

volumes:
  postgres_data:

networks:
  fritterflix_internal:
